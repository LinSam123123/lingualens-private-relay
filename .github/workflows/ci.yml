name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run audit:repository
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run audit:build
      - run: npm run build:firefox
      - run: npm run audit:build:firefox
